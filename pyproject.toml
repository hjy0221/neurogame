[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurogame"
version = "0.1.0"
description = "A small biologically inspired recurrent/spiking neural controller for a 2D game."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pygame>=2.5",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "torch>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
neurogame = "neurogame.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
